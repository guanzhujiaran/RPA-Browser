[project]
name = "rpa-browser"
version = "0.1.0"
description = "rpa-browser"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "addict>=2.4.0",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.21.0",
    "cryptography>=46.0.3",
    "fake-useragent>=2.2.0",
    "fastapi>=0.119.1",
    "fastapi-cdn-host>=0.9.2",
    "loguru>=0.7.3",
    "snowflake-id>=1.0.2",
    "sqlmodel>=0.0.27",
    "uvicorn[standard]>=0.38.0",
    "async-class>=0.5.0",
    "pybrowsers>=1.3.1",
    "chrome-fingerprints>=1.1",
    "hcaptcha-challenger>=0.18.13",
    "browserforge[all]>=1.2.3",
    "ipywidgets>=8.1.8",
    "ipykernel>=7.1.0",
    "patchright>=1.56.0",
    "greenlet>=3.3.0",
    "onnxruntime>=1.23.2",
    "aiofiles>=25.1.0",
    "websockets>=15.0.1",
    "apscheduler>=3.10.4",
    "modelscope>=1.33.0",
    "pydantic-settings>=2.12.0",
    "aiortc>=1.9.0",
    "av>=14.0.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "alembic>=1.18.4",
    "pymysql>=1.1.2",
    "pytest-playwright-asyncio>=0.8.0",
    "aiounittest>=1.5.0",
    "httpx2>=2.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "faststream[rabbit]>=0.6.7",
    "dacite>=1.9.2",
    "bili-common",
]
[tool.uv]
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv.sources]
# 本地路径依赖（非 editable）：uv sync 会把 bili-common 作为普通包复制进 site-packages，
# 这样 ty 等静态工具可直接解析，且不依赖宿主机绝对路径，Docker 构建也安全。
bili-common = { path = "../bili-common", editable = true }

[dependency-groups]
dev = [
    "ty>=0.0.46",
]

[tool.ty.environment]
# bili-common 在本地以 editable 方式安装（MetaPathFinder / .pth 中执行 import 语句），
# ty 不做动态执行，无法静态解析该包；这里把其源码目录加入优先搜索路径。
# 相对路径基于本 pyproject 所在目录（be-message-service）：../bili-common 即仓库内的 bili-common 目录，
# 该目录内含 bili_common 包。Docker 构建时 bili-common 也被 COPY 到 /bili-common，
# 相对 ../bili-common 同样成立，两套环境均可解析。
extra-paths = ["../bili-common"]